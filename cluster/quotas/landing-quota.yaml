apiVersion: v1
kind: ResourceQuota
metadata:
    name: landing-quota
    namespace: landing
spec:
    hard:
        requests.cpu: '500m'
        requests.memory: 768Mi
        limits.cpu: '1'
        limits.memory: 1Gi
        pods: '10'
---
apiVersion: v1
kind: LimitRange
metadata:
    name: landing-limits
    namespace: landing
spec:
    limits:
        - type: Container
          default:
              cpu: 250m
              memory: 256Mi
          defaultRequest:
              cpu: 100m
              memory: 128Mi
          max:
              cpu: '1'
              memory: 1Gi
