# Числа примерно равны тому, что kip и так потребляет сейчас по факту (см.
# cluster/quotas/README.md) — эта квота не урезает kip, она фиксирует его
# текущий аппетит и не даёт ему расти дальше бесконтрольно.
apiVersion: v1
kind: ResourceQuota
metadata:
    name: kip-quota
    namespace: kip
spec:
    hard:
        requests.cpu: '2'
        requests.memory: 2Gi
        limits.cpu: '3'
        limits.memory: 2.5Gi
        pods: '20'
---
apiVersion: v1
kind: LimitRange
metadata:
    name: kip-limits
    namespace: kip
spec:
    limits:
        - type: Container
          default:
              cpu: 250m
              memory: 256Mi
          defaultRequest:
              cpu: 100m
              memory: 128Mi
          max:
              cpu: '2'
              memory: 1Gi
