# Bootstrap-only: applied once by hand with the full admin kubeconfig, never
# by CI itself (a service account must never be able to grant itself rights).
# Not part of kustomization.yaml for that reason.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: landing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: landing
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "persistentvolumeclaims", "pods", "pods/log", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: landing
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: landing
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Explicitly-created Secret of this type gets a long-lived token populated by
# the API server. Needed because Kubernetes 1.24+ stopped auto-creating one
# per ServiceAccount — without this, "kubectl create token" would only give a
# short-lived (default 1h) token, unsuitable for an unattended CI runner.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: landing
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
