apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: landing-postgres
    namespace: landing
spec:
    serviceName: landing-postgres
    replicas: 1
    selector:
        matchLabels:
            app: landing-postgres
    template:
        metadata:
            labels:
                app: landing-postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:16-alpine
                  ports:
                      - containerPort: 5432
                  env:
                      - name: POSTGRES_DB
                        valueFrom:
                            secretKeyRef:
                                name: landing-secret
                                key: DB_DATABASE
                      - name: POSTGRES_USER
                        valueFrom:
                            secretKeyRef:
                                name: landing-secret
                                key: DB_USERNAME
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: landing-secret
                                key: DB_PASSWORD
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: 300m
                          memory: 384Mi
                  readinessProbe:
                      exec:
                          command: ['pg_isready', '-U', '$(POSTGRES_USER)']
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      exec:
                          command: ['pg_isready', '-U', '$(POSTGRES_USER)']
                      initialDelaySeconds: 15
                      periodSeconds: 20
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
    name: landing-postgres
    namespace: landing
spec:
    clusterIP: None
    selector:
        app: landing-postgres
    ports:
        - port: 5432
          targetPort: 5432
