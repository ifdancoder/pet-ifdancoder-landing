apiVersion: v1
kind: ConfigMap
metadata:
    name: landing-config
    namespace: landing
data:
    APP_NAME: 'ifdancoder'
    APP_ENV: 'production'
    APP_DEBUG: 'false'
    APP_URL: 'https://ifdancoder.ru'
    APP_LOCALE: 'ru'
    APP_FALLBACK_LOCALE: 'en'
    BCRYPT_ROUNDS: '12'
    LOG_CHANNEL: 'stack'
    LOG_LEVEL: 'error'
    DB_CONNECTION: 'pgsql'
    DB_HOST: 'landing-postgres'
    DB_PORT: '5432'
    SESSION_DRIVER: 'database'
    SESSION_LIFETIME: '120'
    QUEUE_CONNECTION: 'database'
    CACHE_STORE: 'database'
    FILESYSTEM_DISK: 'public'
