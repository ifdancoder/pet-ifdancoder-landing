# Requires an Ingress Controller (e.g. ingress-nginx) and cert-manager with a
# ClusterIssuer already installed on the cluster — shared, cluster-wide
# infrastructure, not something this repo sets up. See k8s/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: landing
    namespace: landing
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
    ingressClassName: nginx
    tls:
        - hosts:
              - ifdancoder.ru
          secretName: landing-tls
    rules:
        - host: ifdancoder.ru
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: landing
                            port:
                                number: 80
