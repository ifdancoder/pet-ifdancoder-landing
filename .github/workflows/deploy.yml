name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t landing:${{ github.sha }} .

      - name: Import image into containerd
        run: docker save landing:${{ github.sha }} | sudo /usr/local/bin/k3s ctr images import -

      - name: Write production secrets
        # k8s/secret.env is gitignored and only ever exists transiently in
        # the runner's workspace for this one job — it's generated fresh
        # from GitHub repository secrets, never read from or written to disk
        # outside this run. GitHub masks these values in the log automatically.
        run: |
          cat > k8s/secret.env <<EOF
          APP_KEY=${{ secrets.APP_KEY }}
          DB_DATABASE=landing
          DB_USERNAME=landing
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          ADMIN_PATH=${{ secrets.ADMIN_PATH }}
          EOF

      - name: Pin image tag for this deploy
        run: sed -i "s/__TAG__/${{ github.sha }}/g" k8s/deployment.yaml

      - name: Apply manifests
        run: kubectl apply -k k8s/

      - name: Wait for rollout
        run: kubectl rollout status deployment/landing -n landing --timeout=180s

      - name: Drop the build-local copy
        if: always()
        run: docker rmi landing:${{ github.sha }} || true
